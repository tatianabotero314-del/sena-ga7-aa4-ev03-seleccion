name: Verificar React y Spring Boot
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Incorporar archivos fuente versionados
        run: |
          if [ ! -d frontend ] && [ -f fuente-proyecto.zip ]; then unzip -o fuente-proyecto.zip; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend backend docs README.md .gitignore
          git diff --cached --quiet || git commit -m "Versionar fuentes React, API y pruebas"
          git push
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Instalar frontend
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Guardar dependencias reproducibles
        run: |
          cd frontend
          npm run format
          cd ..
          git add frontend
          git diff --cached --quiet || git commit -m "Fijar dependencias del frontend"
          git push
      - name: Estándares y pruebas unitarias
        working-directory: frontend
        run: |
          npm run lint
          npm test
          npm run build
      - name: API y pruebas de integración
        working-directory: backend
        run: mvn -B verify
      - name: Iniciar API real aislada
        run: |
          java -jar backend/target/seleccion-personal-api-1.0.0.jar --spring.datasource.url='jdbc:h2:mem:e2e;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE' > api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/auth/csrf > /dev/null; then exit 0; fi
            sleep 2
          done
          cat api.log
          exit 1
      - name: Instalar navegador de pruebas
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Navegación conectada a Spring Boot
        working-directory: frontend
        run: npm run test:e2e
      - name: Empaquetar fuentes revisadas
        if: always()
        run: zip -r proyecto-verificado.zip frontend backend docs README.md .gitignore .github -x "*/node_modules/*" "*/target/*" "*/dist/*" "*/test-results/*" "*/playwright-report/*"
      - name: Descargar resultados y aplicación compilada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-EV03
          path: |
            frontend/dist
            frontend/package-lock.json
            frontend/playwright-report
            frontend/test-results
            backend/target/surefire-reports
            proyecto-verificado.zip
            api.log
